<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Keyvane</title>
  <!-- Keyvane mark: rounded square with the aurora gradient; a white key whose bow is a
       compass ring and whose tip is a vane arrow, rotated 45°. Geometry mirrors
       apps/keyvane/lib/widgets/brand.dart (w = 64). -->
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17.92" fill="url(#aurora)"/>
  <g transform="translate(32 32) rotate(-45)" fill="none" stroke="#fff" stroke-width="5.44" stroke-linecap="round" stroke-linejoin="round">
    <!-- bow: compass ring with centre dot -->
    <circle cx="-10.88" cy="0" r="9.6"/>
    <circle cx="-10.88" cy="0" r="2.24" fill="#fff" stroke="none"/>
    <!-- shaft -->
    <path d="M-1.28 0H19.2"/>
    <!-- teeth -->
    <path d="M10.24 0V6.4M17.28 0V4.48"/>
    <!-- vane tip -->
    <path d="M19.2 -4.8L25.6 0L19.2 4.8"/>
  </g>
</svg>
